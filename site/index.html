<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Happy GitHub Journey</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="workspace" aria-label="三层空白交互画布">
      <nav class="level-switch" aria-label="切换层级">
        <button type="button" data-jump="0" aria-label="第一层" aria-current="true">01</button>
        <span aria-hidden="true"></span>
        <button type="button" data-jump="1" aria-label="第二层">02</button>
        <span aria-hidden="true"></span>
        <button type="button" data-jump="2" aria-label="第三层">03</button>
      </nav>
      <div class="board">
        <section class="column" data-level="0" aria-label="第一层">
          <div class="column-label" aria-hidden="true">01</div>
          <ol class="slots" aria-label="第一层块列表"></ol>
        </section>
        <section class="column" data-level="1" aria-label="第二层">
          <div class="column-label" aria-hidden="true">02</div>
          <ol class="slots" aria-label="第二层块列表"></ol>
        </section>
        <section class="column" data-level="2" aria-label="第三层">
          <div class="column-label" aria-hidden="true">03</div>
          <ol class="slots" aria-label="第三层块列表"></ol>
        </section>
      </div>
      <div class="screen-reader-only" aria-live="polite" id="status"></div>
    </main>
    <dialog class="detail" aria-label="空白块详情">
      <div class="detail-top">
        <span class="detail-indicator" aria-hidden="true"></span>
        <span class="detail-title" aria-hidden="true"></span>
        <button type="button" class="close-detail" aria-label="关闭详情">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
      </div>
      <div class="detail-space" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </dialog>
  </body>
</html>
