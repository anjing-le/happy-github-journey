<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Happy GitHub Journey</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=20261001" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="workspace" aria-label="三层空白交互画布">
      <nav class="level-switch" aria-label="切换层级">
        <button type="button" data-jump="0" aria-label="项目与文章" aria-current="true">项目与文章</button>
        <span aria-hidden="true"></span>
        <button type="button" data-jump="1" aria-label="关键设计">关键设计</button>
        <span aria-hidden="true"></span>
        <button type="button" data-jump="2" aria-label="技术与原理">技术与原理</button>
      </nav>
      <div class="board">
        <section class="column" data-level="0" aria-label="项目与文章">
          <h2 class="column-label">项目与文章</h2>
          <ol class="slots" aria-label="项目与文章块列表"></ol>
        </section>
        <section class="column" data-level="1" aria-label="关键设计">
          <h2 class="column-label">关键设计</h2>
          <ol class="slots" aria-label="关键设计块列表"></ol>
        </section>
        <section class="column" data-level="2" aria-label="技术与原理">
          <h2 class="column-label">技术与原理</h2>
          <ol class="slots" aria-label="技术与原理块列表"></ol>
        </section>
      </div>
      <div class="screen-reader-only" aria-live="polite" id="status"></div>
    </main>
    <dialog class="detail" id="block-detail" aria-label="空白块详情">
      <div class="detail-top">
        <span class="detail-indicator" aria-hidden="true"></span>
        <span class="detail-title" aria-hidden="true"></span>
        <a class="source-link" target="_blank" rel="noopener noreferrer" aria-label="查看来源" hidden>
          <span>来源</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11 4h5v5m0-5-8 8M7 4H4v12h12v-3"/></svg>
        </a>
        <button type="button" class="close-detail" aria-label="关闭详情">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
      </div>
      <div class="detail-scroll">
        <div class="detail-space" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      </div>
    </dialog>
  </body>
</html>
